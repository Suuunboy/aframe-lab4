<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Лаб. 4 — AR по маркеру</title>
    <!-- A-Frame, как в лабораторной 3 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js для A-Frame (отслеживание маркеров) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
      #status {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
        padding: 6px 12px; border-radius: 8px; font: 14px sans-serif;
        background: rgba(0,0,0,.6); color: #fff;
      }
      #status.found { background: rgba(20,140,60,.8); }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="status">Наведите камеру на маркер Hiro</div>

    <a-scene embedded
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; maxDetectionRate: 60;"
             renderer="logarithmicDepthBuffer: true; colorManagement: true"
             vr-mode-ui="enabled: false">

      <a-assets>
        <a-asset-item id="scene-model" src="models/scene.glb"></a-asset-item>
      </a-assets>

      <!-- Маркер Hiro: всё, что внутри, привязано к маркеру -->
      <!-- smooth*: усреднение позы по последним 10 кадрам убирает дрожание -->
      <a-marker id="marker" preset="hiro" emitevents="true"
                smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <!-- Сцена из лабораторной 3 (Blender → glTF). Диаметр сцены 16 м,
             масштаб 0.06 — модель примерно размером с маркер (1 единица) и стоит на нём -->
        <a-entity gltf-model="#scene-model" scale="0.06 0.06 0.06" position="0 0 0"></a-entity>

        <!-- Подсветка, чтобы модель не была тёмной -->
        <a-entity light="type: ambient; intensity: 0.7"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const marker = document.getElementById('marker');
      const status = document.getElementById('status');
      marker.addEventListener('markerFound', () => {
        status.textContent = 'Маркер найден';
        status.classList.add('found');
      });
      marker.addEventListener('markerLost', () => {
        status.textContent = 'Наведите камеру на маркер Hiro';
        status.classList.remove('found');
      });
      // После поворота телефона AR.js не всегда пересчитывает проекцию камеры,
      // и модель смещается относительно маркера — перезагружаем страницу
      let orient = screen.orientation ? screen.orientation.type : window.orientation;
      window.addEventListener('orientationchange', () => {
        const now = screen.orientation ? screen.orientation.type : window.orientation;
        if (now !== orient) location.reload();
      });
    </script>
  </body>
</html>
